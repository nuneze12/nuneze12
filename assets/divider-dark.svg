<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F4ECE1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F4ECE1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F4ECE1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C49A74" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C49A74"/>
      <stop offset="1" stop-color="#C49A74" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="line">
      <rect x="0" y="5" width="1000" height="2" rx="1"/>
    </clipPath>
  </defs>
  <style>
    .shimmer { animation: drift 11s ease-in-out infinite alternate }
    @keyframes drift {
      0% { transform: translateX(-120px) }
      100% { transform: translateX(800px) }
    }
    @media (prefers-reduced-motion: reduce) {
      .shimmer { animation: none }
      .shimmer { transform: translateX(340px) }
    }
  </style>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#base)"/>
  <g clip-path="url(#line)">
    <rect class="shimmer" x="0" y="5" width="320" height="2" fill="url(#shimmer)"/>
  </g>
</svg>
