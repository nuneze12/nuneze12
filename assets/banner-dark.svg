<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
  <title id="title">Emily Nunez</title>
  <desc id="desc">The name Emily Nunez in large type. A subtitle fades through four lines, IT Project Management, Networking, Cloud and Security, B.S. Information Technology, Montclair State, and MBA Student. On the right, two network segments link through one switch while a packet moves between them.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.88" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#4D3A2B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4D3A2B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#3A2D22" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3A2D22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.85" cy="0.55" r="0.25">
      <stop offset="0" stop-color="#C49A74" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C49A74" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="1000" height="260" rx="18"/>
    </clipPath>
  </defs>
  <style>
    .sub { animation: fade 20s linear infinite }
    .s1 { animation-delay: -1s }
    .s2 { animation-delay: 4s }
    .s3 { animation-delay: 9s }
    .s4 { animation-delay: 14s }
    @keyframes fade {
      0% { opacity: 0 }
      4% { opacity: 1 }
      21% { opacity: 1 }
      25% { opacity: 0 }
      100% { opacity: 0 }
    }
    .packet-still { display: none }
    @media (prefers-reduced-motion: reduce) {
      .sub { animation: none }
      .s1 { opacity: 1 }
      .packet-moving { display: none }
      .packet-still { display: inline }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="#1C1814"/>
    <rect width="1000" height="260" fill="url(#glowA)"/>
    <rect width="1000" height="260" fill="url(#glowB)"/>
    <rect width="1000" height="260" fill="url(#glowC)"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="258.5" rx="17.25" fill="none" stroke="#F4ECE1" stroke-opacity="0.1" stroke-width="1.5"/>
  <text x="60" y="136" font-family='"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif' font-size="80" font-weight="400" letter-spacing="-1" fill="#F4ECE1">Emily Nunez</text>
  <rect x="64" y="156" width="28" height="3" rx="1.5" fill="#C49A74"/>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="32" font-weight="500" fill="#D6C9B8">
    <text class="sub s1" x="64" y="200" opacity="0">IT Project Management</text>
    <text class="sub s2" x="64" y="200" opacity="0">Networking, Cloud and Security</text>
    <text class="sub s3" x="64" y="200" opacity="0">B.S. Information Technology, Montclair State</text>
    <text class="sub s4" x="64" y="200" opacity="0">MBA Student</text>
  </g>
  <g aria-hidden="true">
    <g fill="none" stroke="#C49A74" stroke-opacity="0.45" stroke-width="1.25" stroke-dasharray="4 5">
      <rect x="764" y="58" width="68" height="144" rx="14"/>
      <rect x="868" y="58" width="68" height="144" rx="14"/>
    </g>
    <path d="M798 92 L850 130 M798 130 L850 130 M798 168 L850 130 M902 92 L850 130 M902 130 L850 130 M902 168 L850 130" stroke="#F4ECE1" stroke-opacity="0.25" stroke-width="1.25"/>
    <g fill="#1C1814" stroke="#C49A74" stroke-width="1.75">
      <circle cx="798" cy="92" r="6"/>
      <circle cx="798" cy="130" r="6"/>
      <circle cx="798" cy="168" r="6"/>
      <circle cx="902" cy="92" r="6"/>
      <circle cx="902" cy="130" r="6"/>
      <circle cx="902" cy="168" r="6"/>
    </g>
    <rect x="841" y="121" width="18" height="18" rx="4" fill="#F4ECE1"/>
    <circle class="packet-moving" r="4" fill="#C49A74">
      <animateMotion dur="12s" repeatCount="indefinite" path="M798 92 L850 130 L902 168 L850 130 L798 168 L850 130 L902 92 L850 130 Z"/>
    </circle>
    <circle class="packet-still" cx="824" cy="111" r="4" fill="#C49A74"/>
  </g>
</svg>
